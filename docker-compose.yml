# Maschinen-Monitor – vue.umut-aslan.dev
#   sim (machines) ──MQTT──▶ mqtt (Mosquitto) ──MQTT──▶ app (FastAPI + Vue build) ──▶ db (TimescaleDB)
#                                                         ▲ WebSocket / REST
#   Browser ──▶ Traefik ───────────────────────────────────┘
# Only `app` is on the public proxy network; broker, simulator and database are internal.
services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TS_TUNE_MEMORY: 320MB
      TS_TUNE_NUM_CPUS: "2"
      TIMESCALEDB_TELEMETRY: "off"
    volumes: [db:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      start_period: 20s
      start_interval: 1s

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      SIM_PASSWORD: ${MQTT_SIM_PASSWORD:?set MQTT_SIM_PASSWORD in .env}
      MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?set MQTT_MONITOR_PASSWORD in .env}
    # Password file is built from .env at start; access per user is limited by the ACL (mosquitto/acl).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp /mosquitto/config/acl /tmp/acl && touch /tmp/passwd &&
        mosquitto_passwd -b /tmp/passwd simulator "$$SIM_PASSWORD" &&
        mosquitto_passwd -b /tmp/passwd monitor "$$MONITOR_PASSWORD" &&
        chown mosquitto:mosquitto /tmp/passwd /tmp/acl && chmod 0700 /tmp/passwd /tmp/acl &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
    networks: [internal]
    mem_limit: 32m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 10s
      start_period: 5s
      start_interval: 1s

  sim:
    image: umutaslan/maschinen-monitor:${GIT_SHA:-local}
    restart: unless-stopped
    pull_policy: never  # same image as app, built by compose
    command: ["python", "-m", "monitor.sim"]
    environment:
      MQTT_HOST: mqtt
      MQTT_USER: simulator
      MQTT_PASSWORD: ${MQTT_SIM_PASSWORD}
    depends_on:
      mqtt: { condition: service_healthy }
      app: { condition: service_started }
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    healthcheck:
      disable: true

  app:
    build: .
    image: umutaslan/maschinen-monitor:${GIT_SHA:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://monitor:${DB_PASSWORD}@db:5432/monitor
      MQTT_HOST: mqtt
      MQTT_USER: monitor
      MQTT_PASSWORD: ${MQTT_MONITOR_PASSWORD}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-7}
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_healthy }
    networks: [internal, proxy]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.docker.network=proxy
      - traefik.http.routers.monitor.rule=Host(`vue.umut-aslan.dev`)
      - traefik.http.routers.monitor.entrypoints=websecure
      - traefik.http.routers.monitor.tls.certresolver=myresolver
      - traefik.http.services.monitor.loadbalancer.server.port=8000

volumes:
  db:

networks:
  internal:
    internal: true
  proxy:
    external: true
