[project]
name = "maschinen-monitor"
version = "0.1.0"
description = "Live machine monitoring demo: simulated machines → MQTT → FastAPI → TimescaleDB → Vue"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "asyncpg>=0.32",
  "aiomqtt>=2.5",
  "pywebpush>=2.5",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.2",
  "ruff>=0.17",
  "mypy>=2.4",
  "asyncpg-stubs>=0.31",
  "paho-mqtt>=2.1.0",
  "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "PT"]
# German texts use typographic dashes, multiplication signs and the like on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["monitor"]

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true
